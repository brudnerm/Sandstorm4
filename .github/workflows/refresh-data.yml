name: Refresh Matchup Data

on:
  schedule:
    # Every 15 min during baseball hours: noon-1am ET (16:00-05:00 UTC), Mar-Oct
    - cron: '*/15 16-23,0-5 * 3-10 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Refresh Yahoo OAuth token (tokens rotate on each refresh)
      - name: Refresh Yahoo OAuth token
        id: refresh-token
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: |
          npx tsx scripts/token-manager.ts refresh

          # Read tokens from cache file for next steps
          ACCESS_TOKEN=$(jq -r '.accessToken' token-cache.json)
          REFRESH_TOKEN=$(jq -r '.refreshToken' token-cache.json)

          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
          echo "refresh_token=$REFRESH_TOKEN" >> "$GITHUB_OUTPUT"

      # Update GitHub secrets with new refresh token (for next run's fallback)
      - name: Update GitHub secrets with new refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          REFRESH_TOKEN=$(jq -r '.refreshToken' token-cache.json)
          gh secret set YAHOO_REFRESH_TOKEN --body "$REFRESH_TOKEN" 2>/dev/null || echo "⚠️  Could not update GitHub secret. Next run will auto-refresh from cached token."

      # Fetch matchup data for both leagues
      - name: Fetch matchups
        env:
          YAHOO_ACCESS_TOKEN: ${{ steps.refresh-token.outputs.access_token }}
        run: npx tsx scripts/fetch-matchups.ts --ci

      # Commit and push only if data changed
      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/matchups_kp.json public/data/matchups_sidebar.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update matchup data"
            git push
          fi
